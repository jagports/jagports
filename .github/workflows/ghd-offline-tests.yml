name: GHD Issue classification offline tests

on:
  push:
    branches:
      - impl/ghd-904-issue-pr-migration
    paths:
      - '6-Development/AI/agents/jagports/jagports-lead-agent/**'
      - '.github/workflows/ghd-offline-tests.yml'
  pull_request:
    paths:
      - '6-Development/AI/agents/jagports/jagports-lead-agent/**'
      - '.github/workflows/ghd-offline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghd-and-legacy:
    name: Offline GHD and legacy Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 6-Development/AI/agents/jagports/jagports-lead-agent
    env:
      OPENAI_API_KEY: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install import-only dependencies
        run: python -m pip install 'PyGithub>=2.6,<3' 'python-dotenv>=1,<2' 'PyYAML>=6,<7'
      - name: Compile Lead Agent and tests
        run: python -m compileall -q agents core services tests main.py
      - name: Run mocked GHD and legacy regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
