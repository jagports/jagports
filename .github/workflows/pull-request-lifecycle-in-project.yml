name: Sync Pull Request Lifecycle to Project

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PROJECT_ORG: jagports
  PROJECT_NUMBER: "9"
  PROJECT_TITLE: Jagports AI OS

jobs:
  sync-pull-request-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Add Pull Request to Project and synchronize Status
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          REQUESTED_TEAM: ${{ github.event.requested_team.slug }}
        shell: bash
        run: |
          set -euo pipefail

          report_failure() {
            status=$?
            if [ -n "${COMMENT_TOKEN:-}" ]; then
              sleep 1
              GH_TOKEN="$COMMENT_TOKEN" gh api \
                "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
                -f body="Project automation FAILED for Pull Request #$PR_NUMBER. The Pull Request was not verified as a Project Item with the expected lifecycle state. Inspect this workflow run for the exact failure. No successful Project operation is claimed." \
                >/dev/null || true
            fi
            exit "$status"
          }
          trap report_failure ERR

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PROJECTS_TOKEN is not configured. A token with access to the Project is required."
            exit 1
          fi

          echo "Pull Request: #$PR_NUMBER"
          echo "Lifecycle action: $PR_ACTION"

          PROJECT_QUERY='
          query($org:String!, $number:Int!) {
            organization(login:$org) {
              projectV2(number:$number) {
                id
                title
                fields(first:50) {
                  nodes {
                    ... on ProjectV2Field { id name }
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                      options { id name }
                    }
                  }
                }
              }
            }
          }'

          project_json="$(gh api graphql -f query="$PROJECT_QUERY" -F org="$PROJECT_ORG" -F number="$PROJECT_NUMBER")"
          sleep 1

          project_id="$(jq -r '.data.organization.projectV2.id // empty' <<<"$project_json")"
          project_title="$(jq -r '.data.organization.projectV2.title // empty' <<<"$project_json")"
          status_field_id="$(jq -r '.data.organization.projectV2.fields.nodes[]? | select(.name == "Status" and .options != null) | .id' <<<"$project_json" | head -n1)"

          [ -n "$project_id" ] || { echo "Project was not found."; exit 1; }
          [ "$project_title" = "$PROJECT_TITLE" ] || { echo "Unexpected Project title: $project_title"; exit 1; }
          [ -n "$status_field_id" ] || { echo "Status field was not found."; exit 1; }

          PR_QUERY='
          query($pr:ID!) {
            node(id:$pr) {
              ... on PullRequest {
                id
                number
                state
                isDraft
                projectItems(first:20) {
                  nodes {
                    id
                    isArchived
                    project { id title number }
                    content { ... on PullRequest { id number } }
                    fieldValueByName(name:"Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue { name optionId }
                    }
                  }
                }
              }
            }
          }'

          read_pr() {
            pr_json="$(gh api graphql -f query="$PR_QUERY" -F pr="$PR_NODE_ID")"
            sleep 1
            verified_pr_id="$(jq -r '.data.node.id // empty' <<<"$pr_json")"
            verified_pr_number="$(jq -r '.data.node.number // empty' <<<"$pr_json")"
            pr_is_draft="$(jq -r '.data.node.isDraft' <<<"$pr_json")"
            [ "$verified_pr_id" = "$PR_NODE_ID" ] || { echo "Pull Request identity verification failed."; false; }
            [ "$verified_pr_number" = "$PR_NUMBER" ] || { echo "Pull Request number verification failed."; false; }
          }

          read_pr

          active_item_id="$(jq -r --arg project "$project_id" --arg pr "$PR_NODE_ID" '.data.node.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false and .content.id == $pr) | .id' <<<"$pr_json" | head -n1)"
          archived_item_id="$(jq -r --arg project "$project_id" --arg pr "$PR_NODE_ID" '.data.node.projectItems.nodes[]? | select(.project.id == $project and .isArchived == true and .content.id == $pr) | .id' <<<"$pr_json" | head -n1)"

          requested_review_count() {
            local requested_json independent_users teams
            requested_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers")"
            sleep 1
            independent_users="$(jq --arg author "$PR_AUTHOR" '[.users[]? | select(.login != $author)] | length' <<<"$requested_json")"
            teams="$(jq '[.teams[]?] | length' <<<"$requested_json")"
            echo $((independent_users + teams))
          }

          TARGET_LABEL=""
          ARCHIVE_AFTER=false

          case "$PR_ACTION" in
            opened|ready_for_review|converted_to_draft)
              TARGET_LABEL="IMPLEMENTATION"
              ;;
            review_requested)
              if [ -n "${REQUESTED_REVIEWER:-}" ] && [ "$REQUESTED_REVIEWER" = "$PR_AUTHOR" ]; then
                echo "Review requested from PR author; this does not establish independent REVIEW."
                TARGET_LABEL="IMPLEMENTATION"
              elif [ -n "${REQUESTED_REVIEWER:-}" ] || [ -n "${REQUESTED_TEAM:-}" ]; then
                TARGET_LABEL="REVIEW"
              else
                echo "review_requested event contained no reviewer/team identity."
                exit 1
              fi
              ;;
            review_request_removed|reopened)
              if [ "$pr_is_draft" = "true" ]; then
                TARGET_LABEL="IMPLEMENTATION"
              elif [ "$(requested_review_count)" -gt 0 ]; then
                TARGET_LABEL="REVIEW"
              else
                TARGET_LABEL="IMPLEMENTATION"
              fi
              ;;
            closed)
              if [ "$PR_MERGED" = "true" ]; then
                TARGET_LABEL="DONE"
              else
                ARCHIVE_AFTER=true
              fi
              ;;
            *)
              echo "Unhandled action '$PR_ACTION' — nothing to do."
              trap - ERR
              exit 0
              ;;
          esac

          ADD_MUTATION='
          mutation($project:ID!, $pr:ID!) {
            addProjectV2ItemById(input:{projectId:$project, contentId:$pr}) {
              item { id }
            }
          }'

          UNARCHIVE_MUTATION='
          mutation($project:ID!, $item:ID!) {
            unarchiveProjectV2Item(input:{projectId:$project, itemId:$item}) {
              item { id isArchived }
            }
          }'

          ARCHIVE_MUTATION='
          mutation($project:ID!, $item:ID!) {
            archiveProjectV2Item(input:{projectId:$project, itemId:$item}) {
              item { id isArchived }
            }
          }'

          SET_STATUS_MUTATION='
          mutation($project:ID!, $item:ID!, $field:ID!, $option:String!) {
            updateProjectV2ItemFieldValue(input:{
              projectId:$project
              itemId:$item
              fieldId:$field
              value:{singleSelectOptionId:$option}
            }) {
              projectV2Item { id }
            }
          }'

          VERIFY_QUERY='
          query($item:ID!) {
            node(id:$item) {
              ... on ProjectV2Item {
                id
                isArchived
                project { id title number }
                content { ... on PullRequest { id number } }
                fieldValueByName(name:"Status") {
                  ... on ProjectV2ItemFieldSingleSelectValue { name optionId }
                }
              }
            }
          }'

          if [ "$ARCHIVE_AFTER" = "true" ] && [ -z "$active_item_id" ] && [ -n "$archived_item_id" ]; then
            echo "Closed-unmerged Pull Request already has archived Project Item $archived_item_id; verifying terminal state."
            item_id="$archived_item_id"
          else
            if [ -z "$active_item_id" ]; then
              if [ -n "$archived_item_id" ]; then
                echo "Unarchiving existing Pull Request Project Item $archived_item_id..."
                gh api graphql -f query="$UNARCHIVE_MUTATION" -F project="$project_id" -F item="$archived_item_id" >/dev/null
                sleep 1
              else
                echo "Adding Pull Request #$PR_NUMBER to Project..."
                gh api graphql -f query="$ADD_MUTATION" -F project="$project_id" -F pr="$PR_NODE_ID" >/dev/null
                sleep 1
              fi

              read_pr
              active_item_id="$(jq -r --arg project "$project_id" --arg pr "$PR_NODE_ID" '.data.node.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false and .content.id == $pr) | .id' <<<"$pr_json" | head -n1)"
            fi

            item_id="$active_item_id"
          fi

          [ -n "$item_id" ] || { echo "Pull Request Project Item could not be resolved."; exit 1; }

          if [ -n "$TARGET_LABEL" ]; then
            target_option_id="$(jq -r --arg target "$TARGET_LABEL" '.data.organization.projectV2.fields.nodes[]? | select(.name == "Status" and .options != null) | .options[]? | select(.name == $target) | .id' <<<"$project_json" | head -n1)"
            [ -n "$target_option_id" ] || { echo "$TARGET_LABEL Status option was not found."; exit 1; }

            echo "Setting Pull Request Project Item Status to $TARGET_LABEL..."
            gh api graphql \
              -f query="$SET_STATUS_MUTATION" \
              -F project="$project_id" \
              -F item="$item_id" \
              -F field="$status_field_id" \
              -F option="$target_option_id" \
              >/dev/null
            sleep 1
          fi

          if [ "$ARCHIVE_AFTER" = "true" ]; then
            verify_before_archive="$(gh api graphql -f query="$VERIFY_QUERY" -F item="$item_id")"
            sleep 1
            already_archived="$(jq -r '.data.node.isArchived' <<<"$verify_before_archive")"
            if [ "$already_archived" != "true" ]; then
              echo "Closing without merge: preserving the last non-success Status and archiving the Pull Request Project Item."
              gh api graphql -f query="$ARCHIVE_MUTATION" -F project="$project_id" -F item="$item_id" >/dev/null
              sleep 1
            fi
          fi

          echo "Independently verifying Project Item identity, Project identity, archive state and Status..."
          verify_json="$(gh api graphql -f query="$VERIFY_QUERY" -F item="$item_id")"
          sleep 1

          verified_item_id="$(jq -r '.data.node.id // empty' <<<"$verify_json")"
          verified_project_id="$(jq -r '.data.node.project.id // empty' <<<"$verify_json")"
          verified_project_title="$(jq -r '.data.node.project.title // empty' <<<"$verify_json")"
          verified_pr_id="$(jq -r '.data.node.content.id // empty' <<<"$verify_json")"
          verified_pr_number="$(jq -r '.data.node.content.number // empty' <<<"$verify_json")"
          verified_status="$(jq -r '.data.node.fieldValueByName.name // empty' <<<"$verify_json")"
          verified_option="$(jq -r '.data.node.fieldValueByName.optionId // empty' <<<"$verify_json")"
          archived="$(jq -r '.data.node.isArchived' <<<"$verify_json")"

          [ "$verified_item_id" = "$item_id" ] || { echo "Verification failed: Project Item identity mismatch."; exit 1; }
          [ "$verified_project_id" = "$project_id" ] || { echo "Verification failed: Project identity mismatch."; exit 1; }
          [ "$verified_project_title" = "$PROJECT_TITLE" ] || { echo "Verification failed: Project title mismatch."; exit 1; }
          [ "$verified_pr_id" = "$PR_NODE_ID" ] || { echo "Verification failed: Project Item does not contain the triggering Pull Request identity."; exit 1; }
          [ "$verified_pr_number" = "$PR_NUMBER" ] || { echo "Verification failed: Project Item does not contain Pull Request #$PR_NUMBER."; exit 1; }

          if [ "$ARCHIVE_AFTER" = "true" ]; then
            [ "$archived" = "true" ] || { echo "Verification failed: closed-unmerged Project Item is not archived."; exit 1; }
            [ "$verified_status" != "DONE" ] || { echo "Verification failed: closed-unmerged Pull Request is represented as successful DONE."; exit 1; }
            echo "PASS: Pull Request #$PR_NUMBER is verified as archived without successful DONE status. Last non-success Status: ${verified_status:-<unset>}."
          else
            [ "$archived" = "false" ] || { echo "Verification failed: active/merged Pull Request Project Item is archived unexpectedly."; exit 1; }
            [ "$verified_status" = "$TARGET_LABEL" ] || { echo "Verification failed: Project Item Status is '$verified_status', not $TARGET_LABEL."; exit 1; }
            [ "$verified_option" = "$target_option_id" ] || { echo "Verification failed: Status option ID does not match $TARGET_LABEL."; exit 1; }
            echo "PASS: Pull Request #$PR_NUMBER is verified as active Project Item $item_id in '$PROJECT_TITLE' with Project Item Status $TARGET_LABEL ($target_option_id)."
          fi

          trap - ERR
