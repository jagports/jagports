name: Migrate Operational Priority to Issue Priority

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PROJECT_ORG: jagports
  PROJECT_NUMBER: "9"
  PROJECT_TITLE: Jagports AI OS
  LEGACY_FIELD_NAME: Operational Priority
  ISSUE_PRIORITY_FIELD_NAME: Priority
  CONTROL_ISSUE: "714"

jobs:
  migrate-and-retire:
    if: github.event.issue.number == 714
    runs-on: ubuntu-latest
    steps:
      - name: Migrate values and retire duplicate Project field
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ISSUE_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        shell: bash
        run: |
          set -euo pipefail

          case "$COMMENT_AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "Ignoring migration command from untrusted association '$COMMENT_AUTHOR_ASSOCIATION'."
              exit 0
              ;;
          esac

          if ! printf '%s\n' "$COMMENT_BODY" | tr -d '\r' | grep -Fxq '<!-- jagports-retire-operational-priority -->'; then
            echo "No standalone migration marker; nothing to do."
            exit 0
          fi

          [ -n "${GH_TOKEN:-}" ] || { echo "PROJECTS_TOKEN is not configured."; false; }

          PROJECT_QUERY='
          query($org:String!, $number:Int!) {
            organization(login:$org) {
              projectV2(number:$number) {
                id
                title
                fields(first:100) {
                  nodes {
                    __typename
                    ... on ProjectV2Field { id name dataType }
                  }
                }
              }
            }
          }'

          project_json="$(gh api graphql -f query="$PROJECT_QUERY" -F org="$PROJECT_ORG" -F number="$PROJECT_NUMBER")"
          project_id="$(jq -r '.data.organization.projectV2.id // empty' <<<"$project_json")"
          project_title="$(jq -r '.data.organization.projectV2.title // empty' <<<"$project_json")"
          [ -n "$project_id" ] || { echo "Project was not found."; false; }
          [ "$project_title" = "$PROJECT_TITLE" ] || { echo "Unexpected Project title: $project_title"; false; }

          legacy_count="$(jq --arg name "$LEGACY_FIELD_NAME" '[.data.organization.projectV2.fields.nodes[]? | select(.name == $name)] | length' <<<"$project_json")"
          if [ "$legacy_count" -eq 0 ]; then
            echo "Legacy field is already absent; migration is already retired."
            exit 0
          fi
          [ "$legacy_count" -eq 1 ] || { echo "Expected one '$LEGACY_FIELD_NAME' field; found $legacy_count."; false; }

          legacy_field_id="$(jq -r --arg name "$LEGACY_FIELD_NAME" '.data.organization.projectV2.fields.nodes[]? | select(.name == $name and .__typename == "ProjectV2Field") | .id' <<<"$project_json")"
          legacy_type="$(jq -r --arg name "$LEGACY_FIELD_NAME" '.data.organization.projectV2.fields.nodes[]? | select(.name == $name and .__typename == "ProjectV2Field") | .dataType // empty' <<<"$project_json")"
          [ -n "$legacy_field_id" ] || { echo "Legacy field ID was not resolved."; false; }
          [ "$legacy_type" = "TEXT" ] || { echo "Legacy field type is '$legacy_type', expected TEXT."; false; }

          ITEMS_FIRST_QUERY='
          query($project:ID!, $legacy:String!) {
            node(id:$project) {
              ... on ProjectV2 {
                items(first:100) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    id
                    content {
                      ... on Issue { id number repository { nameWithOwner } }
                    }
                    legacy: fieldValueByName(name:$legacy) {
                      ... on ProjectV2ItemFieldTextValue { text }
                    }
                  }
                }
              }
            }
          }'

          ITEMS_NEXT_QUERY='
          query($project:ID!, $legacy:String!, $after:String!) {
            node(id:$project) {
              ... on ProjectV2 {
                items(first:100, after:$after) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    id
                    content {
                      ... on Issue { id number repository { nameWithOwner } }
                    }
                    legacy: fieldValueByName(name:$legacy) {
                      ... on ProjectV2ItemFieldTextValue { text }
                    }
                  }
                }
              }
            }
          }'

          SET_ISSUE_PRIORITY='
          mutation($issue:ID!, $field:String!, $value:String!) {
            updateIssue(input:{
              id:$issue
              issueFieldUpdates:[{fieldName:$field, operation:SET, value:$value}]
            }) { issue { id } }
          }'

          CLEAR_ISSUE_PRIORITY='
          mutation($issue:ID!, $field:String!) {
            updateIssue(input:{
              id:$issue
              issueFieldUpdates:[{fieldName:$field, operation:CLEAR}]
            }) { issue { id } }
          }'

          VERIFY_ISSUE_PRIORITY='
          query($issue:ID!) {
            node(id:$issue) {
              ... on Issue {
                id
                issueFieldValues(first:50) {
                  nodes {
                    __typename
                    ... on IssueFieldSingleSelectValue {
                      name
                      field { ... on IssueFieldSingleSelect { name } }
                    }
                  }
                }
              }
            }
          }'

          migrated=0
          cursor=""
          first_page=true

          while true; do
            if [ "$first_page" = true ]; then
              items_json="$(gh api graphql -f query="$ITEMS_FIRST_QUERY" -F project="$project_id" -f legacy="$LEGACY_FIELD_NAME")"
              first_page=false
            else
              items_json="$(gh api graphql -f query="$ITEMS_NEXT_QUERY" -F project="$project_id" -f legacy="$LEGACY_FIELD_NAME" -f after="$cursor")"
            fi

            while IFS=$'\t' read -r issue_id issue_number repo_name band; do
              [ -n "$band" ] || continue
              [ -n "$issue_id" ] || { echo "Legacy priority exists on a non-Issue Project item; refusing retirement."; false; }
              [ "$repo_name" = "$REPOSITORY" ] || { echo "Legacy priority exists on Issue #$issue_number from '$repo_name'; refusing cross-repository migration."; false; }

              case "$band" in
                P0) target="Urgent" ;;
                P1) target="High" ;;
                P2) target="Medium" ;;
                P3|P4) target="Low" ;;
                P5) target="" ;;
                *) echo "Unknown legacy priority '$band' on Issue #$issue_number."; false ;;
              esac

              if [ "$band" = "P5" ]; then
                GH_TOKEN="$ISSUE_TOKEN" gh api graphql -f query="$CLEAR_ISSUE_PRIORITY" -F issue="$issue_id" -f field="$ISSUE_PRIORITY_FIELD_NAME" >/dev/null
              else
                GH_TOKEN="$ISSUE_TOKEN" gh api graphql -f query="$SET_ISSUE_PRIORITY" -F issue="$issue_id" -f field="$ISSUE_PRIORITY_FIELD_NAME" -f value="$target" >/dev/null
              fi

              verify_json="$(GH_TOKEN="$ISSUE_TOKEN" gh api graphql -f query="$VERIFY_ISSUE_PRIORITY" -F issue="$issue_id")"
              if [ "$band" = "P5" ]; then
                jq -e --arg field "$ISSUE_PRIORITY_FIELD_NAME" '[.data.node.issueFieldValues.nodes[]? | select(.__typename == "IssueFieldSingleSelectValue" and .field.name == $field)] | length == 0' <<<"$verify_json" >/dev/null \
                  || { echo "Issue #$issue_number Priority was not cleared."; false; }
              else
                actual="$(jq -r --arg field "$ISSUE_PRIORITY_FIELD_NAME" '.data.node.issueFieldValues.nodes[]? | select(.__typename == "IssueFieldSingleSelectValue" and .field.name == $field) | .name' <<<"$verify_json" | head -n1)"
                [ "$actual" = "$target" ] || { echo "Issue #$issue_number Priority is '$actual', expected '$target'."; false; }
              fi

              migrated=$((migrated + 1))
              echo "Verified Issue #$issue_number: $band -> ${target:-unset}"
            done < <(jq -r '.data.node.items.nodes[]? | [.content.id // "", (.content.number // "" | tostring), .content.repository.nameWithOwner // "", .legacy.text // ""] | @tsv' <<<"$items_json")

            has_next="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$items_json")"
            [ "$has_next" = "true" ] || break
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor // empty' <<<"$items_json")"
            [ -n "$cursor" ] || { echo "Pagination cursor missing while more Project items exist."; false; }
          done

          DELETE_FIELD='
          mutation($field:ID!) {
            deleteProjectV2Field(input:{fieldId:$field}) {
              projectV2Field { ... on ProjectV2Field { id name } }
            }
          }'
          gh api graphql -f query="$DELETE_FIELD" -F field="$legacy_field_id" >/dev/null

          verify_project="$(gh api graphql -f query="$PROJECT_QUERY" -F org="$PROJECT_ORG" -F number="$PROJECT_NUMBER")"
          jq -e --arg name "$LEGACY_FIELD_NAME" '[.data.organization.projectV2.fields.nodes[]? | select(.name == $name)] | length == 0' <<<"$verify_project" >/dev/null \
            || { echo "Legacy Project field still exists after deletion."; false; }

          success_body="$(printf 'Priority architecture migration **PASS**.\n\n- Migrated and independently verified %s existing `%s` value(s) to native Issue `%s`.\n- Retired Project field `%s` only after all migrations passed.\n- Project `%s` no longer exposes the duplicate field.' "$migrated" "$LEGACY_FIELD_NAME" "$ISSUE_PRIORITY_FIELD_NAME" "$LEGACY_FIELD_NAME" "$PROJECT_TITLE")"
          GH_TOKEN="$ISSUE_TOKEN" gh api "repos/$REPOSITORY/issues/$CONTROL_ISSUE/comments" -f body="$success_body" >/dev/null
