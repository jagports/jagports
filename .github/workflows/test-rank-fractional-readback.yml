name: Test fractional Rank read-back rejection

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

env:
  PROJECT_ORG: jagports
  PROJECT_NUMBER: "9"
  PROJECT_TITLE: Jagports AI OS
  RANK_FIELD_NAME: Rank
  FIXTURE_ISSUE_NUMBER: "726"

jobs:
  verify-fractional-rank-rejection:
    runs-on: ubuntu-latest
    steps:
      - name: Store fractional Rank, verify rejection, restore original value
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          [ -n "${GH_TOKEN:-}" ] || { echo "PROJECTS_TOKEN is not configured."; false; }

          OWNER="${REPOSITORY%%/*}"
          NAME="${REPOSITORY##*/}"

          QUERY='
          query($org:String!, $projectNumber:Int!, $owner:String!, $name:String!, $issueNumber:Int!, $rankField:String!) {
            organization(login:$org) {
              projectV2(number:$projectNumber) {
                id
                title
                fields(first:100) {
                  nodes {
                    __typename
                    ... on ProjectV2Field { id name dataType }
                  }
                }
              }
            }
            repository(owner:$owner,name:$name) {
              issue(number:$issueNumber) {
                id
                number
                projectItems(first:50) {
                  nodes {
                    id
                    isArchived
                    project { id }
                    rankValue: fieldValueByName(name:$rankField) {
                      ... on ProjectV2ItemFieldNumberValue { number }
                    }
                  }
                }
              }
            }
          }'

          read_state() {
            gh api graphql \
              -f query="$QUERY" \
              -F org="$PROJECT_ORG" \
              -F projectNumber="$PROJECT_NUMBER" \
              -f owner="$OWNER" \
              -f name="$NAME" \
              -F issueNumber="$FIXTURE_ISSUE_NUMBER" \
              -f rankField="$RANK_FIELD_NAME"
          }

          state="$(read_state)"
          project_id="$(jq -r '.data.organization.projectV2.id // empty' <<<"$state")"
          project_title="$(jq -r '.data.organization.projectV2.title // empty' <<<"$state")"
          [ -n "$project_id" ] || { echo "Project was not found."; false; }
          [ "$project_title" = "$PROJECT_TITLE" ] || { echo "Unexpected Project title '$project_title'."; false; }

          rank_fields="$(jq --arg name "$RANK_FIELD_NAME" '[.data.organization.projectV2.fields.nodes[]? | select(.name == $name and .__typename == "ProjectV2Field" and .dataType == "NUMBER")]' <<<"$state")"
          [ "$(jq 'length' <<<"$rank_fields")" -eq 1 ] || { echo "Expected exactly one numeric Rank field."; false; }
          rank_field_id="$(jq -r '.[0].id' <<<"$rank_fields")"

          issue_id="$(jq -r '.data.repository.issue.id // empty' <<<"$state")"
          [ -n "$issue_id" ] || { echo "Fixture Issue #$FIXTURE_ISSUE_NUMBER was not found."; false; }

          item_matches="$(jq -c --arg project "$project_id" '[.data.repository.issue.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false)]' <<<"$state")"
          [ "$(jq 'length' <<<"$item_matches")" -eq 1 ] || { echo "Expected exactly one active Project Item for fixture Issue #$FIXTURE_ISSUE_NUMBER."; false; }
          item_id="$(jq -r '.[0].id' <<<"$item_matches")"
          original_rank="$(jq -r '.[0].rankValue.number // empty' <<<"$item_matches")"

          SET_NUMBER='mutation($project:ID!, $item:ID!, $field:ID!, $number:Float!) { updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{number:$number}}) { projectV2Item { id } } }'
          CLEAR_FIELD='mutation($project:ID!, $item:ID!, $field:ID!) { clearProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field}) { projectV2Item { id } } }'

          set_number() {
            number="$1"
            request_json="$(jq -n \
              --arg query "$SET_NUMBER" \
              --arg project "$project_id" \
              --arg item "$item_id" \
              --arg field "$rank_field_id" \
              --argjson number "$number" \
              '{query:$query,variables:{project:$project,item:$item,field:$field,number:$number}}')"
            printf '%s' "$request_json" | gh api graphql --input - >/dev/null
          }

          restore_original() {
            set +e
            if [ -z "$original_rank" ]; then
              gh api graphql -f query="$CLEAR_FIELD" -F project="$project_id" -F item="$item_id" -F field="$rank_field_id" >/dev/null
            else
              set_number "$original_rank"
            fi
          }

          cleanup() {
            status=$?
            restore_original
            exit "$status"
          }
          trap cleanup EXIT

          set_number "1.5"

          fractional_state="$(read_state)"
          fractional_rank="$(jq -r --arg project "$project_id" '.data.repository.issue.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false) | .rankValue.number // empty' <<<"$fractional_state" | head -n1)"
          [ "$fractional_rank" = "1.5" ] || { echo "Fractional Rank read-back is '$fractional_rank', expected '1.5'."; false; }

          verify_json="$(jq -n --argjson number "$fractional_rank" '{data:{node:{rankValue:{number:$number}}}}')"
          if jq -e --argjson expected "1" '.data.node.rankValue.number != null and .data.node.rankValue.number == $expected and (.data.node.rankValue.number | floor) == .data.node.rankValue.number' <<<"$verify_json" >/dev/null; then
            echo "FAIL: production integer verifier incorrectly accepted fractional Rank 1.5 as canonical Rank 1."
            false
          fi
          echo "PASS: production integer verifier rejected authoritative fractional Rank 1.5 for expected canonical Rank 1."

          restore_original
          restored_state="$(read_state)"
          restored_rank="$(jq -r --arg project "$project_id" '.data.repository.issue.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false) | .rankValue.number // empty' <<<"$restored_state" | head -n1)"
          if [ -z "$original_rank" ]; then
            [ -z "$restored_rank" ] || { echo "Original empty Rank was not restored; found '$restored_rank'."; false; }
          else
            [ "$restored_rank" = "$original_rank" ] || { echo "Original Rank '$original_rank' was not restored; found '$restored_rank'."; false; }
          fi

          trap - EXIT
          echo "PASS: fractional read-back rejection was verified and fixture Rank was restored."
