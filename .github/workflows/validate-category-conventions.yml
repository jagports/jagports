name: Validate category conventions

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  validate-category:
    if: >-
      github.event.action != 'edited' ||
      github.event.changes.title != null
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run category synchronization tests
        run: node --test .github/scripts/category-conventions.test.js

      - name: Set matching category label
        uses: actions/github-script@v8
        with:
          script: |
            const { getCategorySyncPlan } = require('./.github/scripts/category-conventions.js');
            const item = context.eventName === 'issues' ? context.payload.issue : context.payload.pull_request;
            const issueOrPr = item.number;
            const title = item.title || '';
            const currentLabels = (item.labels || []).map(label => typeof label === 'string' ? label : label.name);
            const plan = getCategorySyncPlan(title, currentLabels);

            if (!plan.expectedLabel) return;

            if (plan.add.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueOrPr,
                labels: plan.add
              });
              core.info(`Added ${plan.add.join(', ')} for ${plan.prefix}`);
            }

            for (const label of plan.remove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueOrPr,
                name: label
              });
              core.info(`Removed stale ${label} for ${plan.prefix}`);
            }

      - name: Validate title prefix and category label
        uses: actions/github-script@v8
        with:
          script: |
            const { getCategorySyncPlan } = require('./.github/scripts/category-conventions.js');
            const event = context.eventName;
            const item = event === 'issues' ? context.payload.issue : context.payload.pull_request;
            const title = item.title || '';
            const currentLabels = (item.labels || []).map(label => typeof label === 'string' ? label : label.name);
            const plan = getCategorySyncPlan(title, currentLabels);

            // Ordinary titles are valid and do not require a category prefix.
            if (!plan.expectedLabel) {
              core.info('No known category prefix: ordinary title, no category validation required.');
              return;
            }
            if (plan.error) {
              core.setFailed(plan.error);
              return;
            }

            const refreshed = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number
            });
            const refreshedLabels = refreshed.data.labels.map(label => typeof label === 'string' ? label : label.name);
            if (!refreshedLabels.includes(plan.expectedLabel)) {
              core.setFailed(`Title prefix ${plan.prefix} requires label ${plan.expectedLabel}.`);
              return;
            }
            if (plan.remove.some(label => refreshedLabels.includes(label))) {
              core.setFailed(`Category label does not match title prefix: ${plan.remove.filter(label => refreshedLabels.includes(label)).join(', ')}`);
              return;
            }
            core.info(`Category convention valid: ${plan.prefix} ↔ ${plan.expectedLabel}`);
