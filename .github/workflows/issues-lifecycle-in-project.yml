name: Sync Issue Lifecycle to Project

on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read
  issues: write

# The target is the organization-owned Project used as the Jagports AI OS kanban.
# Project mutations use PROJECTS_TOKEN authenticated as the Project-access identity.
env:
  PROJECT_ORG: jagports
  PROJECT_NUMBER: "9"
  PROJECT_TITLE: Jagports AI OS
  URGENCY_FIELD_NAME: Urgency

jobs:
  sync-issue-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue to Project and synchronize Status
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail

          report_failure() {
            status=$?
            if [ -n "${COMMENT_TOKEN:-}" ]; then
              sleep 1
              GH_TOKEN="$COMMENT_TOKEN" gh api \
                "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" \
                -f body="Project automation FAILED for Issue #$ISSUE_NUMBER. The Issue was not verified as a Project Item with the expected lifecycle Status. Inspect this workflow run for the exact failure. No successful Project operation is claimed." \
                >/dev/null || true
            fi
            exit "$status"
          }
          trap report_failure ERR

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PROJECTS_TOKEN is not configured. A token with access to the Project is required."
            exit 1
          fi

          case "$ISSUE_ACTION" in
            opened|reopened)
              TARGET_LABEL="BACKLOG"
              ;;
            closed)
              TARGET_LABEL="DONE"
              ;;
            *)
              echo "Unhandled action '$ISSUE_ACTION' — nothing to do."
              exit 0
              ;;
          esac

          echo "Issue: #$ISSUE_NUMBER"
          echo "Lifecycle action: $ISSUE_ACTION"
          echo "Target Project Item Status: $TARGET_LABEL"

          echo "Resolving Project $PROJECT_ORG/$PROJECT_NUMBER..."
          PROJECT_QUERY='
          query($org:String!, $number:Int!) {
            organization(login:$org) {
              projectV2(number:$number) {
                id
                title
                fields(first:50) {
                  nodes {
                    ... on ProjectV2Field { id name }
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                      options { id name }
                    }
                  }
                }
              }
            }
          }'
          project_json="$(gh api graphql -f query="$PROJECT_QUERY" -F org="$PROJECT_ORG" -F number="$PROJECT_NUMBER")"
          sleep 1

          project_id="$(jq -r '.data.organization.projectV2.id // empty' <<<"$project_json")"
          project_title="$(jq -r '.data.organization.projectV2.title // empty' <<<"$project_json")"
          status_field_id="$(jq -r '.data.organization.projectV2.fields.nodes[]? | select(.name == "Status" and .options != null) | .id' <<<"$project_json" | head -n1)"
          target_option_id="$(jq -r --arg target "$TARGET_LABEL" '.data.organization.projectV2.fields.nodes[]? | select(.name == "Status" and .options != null) | .options[]? | select(.name == $target) | .id' <<<"$project_json" | head -n1)"
          urgency_field_id="$(jq -r --arg name "$URGENCY_FIELD_NAME" '.data.organization.projectV2.fields.nodes[]? | select(.name == $name and .dataType == "NUMBER") | .id' <<<"$project_json" | head -n1)"
          if [ -z "$urgency_field_id" ]; then
            CREATE_URGENCY_FIELD='mutation($project:ID!, $name:String!) { createProjectV2Field(input:{projectId:$project,name:$name,dataType:NUMBER}) { projectV2Field { ... on ProjectV2Field { id name dataType } } } }'
            gh api graphql -f query="$CREATE_URGENCY_FIELD" -F project="$project_id" -f name="$URGENCY_FIELD_NAME" >/dev/null
            sleep 1
            project_json="$(gh api graphql -f query="$PROJECT_QUERY" -F org="$PROJECT_ORG" -F number="$PROJECT_NUMBER")"
            urgency_field_id="$(jq -r --arg name "$URGENCY_FIELD_NAME" '.data.organization.projectV2.fields.nodes[]? | select(.name == $name and .dataType == "NUMBER") | .id' <<<"$project_json" | head -n1)"
          fi

          [ -n "$project_id" ] || { echo "Project was not found."; exit 1; }
          [ "$project_title" = "$PROJECT_TITLE" ] || { echo "Unexpected Project title: $project_title"; exit 1; }
          [ -n "$status_field_id" ] || { echo "Status field was not found."; exit 1; }
          [ -n "$target_option_id" ] || { echo "$TARGET_LABEL Status option was not found."; exit 1; }
          [ -n "$urgency_field_id" ] || { echo "Urgency numeric field was not found or created."; exit 1; }

          echo "Project resolved: $project_title"
          echo "Status field: $status_field_id"
          echo "$TARGET_LABEL option: $target_option_id"

          # ProjectV2.items(...) is intentionally not used here. Under the
          # Actions PROJECTS_TOKEN it is not authorization-compatible. The
          # triggering Issue exposes its own Project Item connection instead.
          echo "Discovering Project Item through Issue.projectItems..."
          ISSUE_QUERY='
          query($issue:ID!) {
            node(id:$issue) {
              ... on Issue {
                id
                number
                projectItems(first:20) {
                  nodes {
                    id
                    isArchived
                    project { id title number }
                    content { ... on Issue { id number } }
                    urgencyValue: fieldValueByName(name:"Urgency") { ... on ProjectV2ItemFieldNumberValue { number } }
                  }
                }
              }
            }
          }'
          issue_json="$(gh api graphql -f query="$ISSUE_QUERY" -F issue="$ISSUE_NODE_ID")"
          sleep 1

          verified_issue_id="$(jq -r '.data.node.id // empty' <<<"$issue_json")"
          verified_issue_number="$(jq -r '.data.node.number // empty' <<<"$issue_json")"
          [ "$verified_issue_id" = "$ISSUE_NODE_ID" ] || { echo "Verification failed: triggering Issue identity could not be independently verified."; exit 1; }
          [ "$verified_issue_number" = "$ISSUE_NUMBER" ] || { echo "Verification failed: triggering Issue number does not match event Issue."; exit 1; }

          item_id="$(jq -r --arg project "$project_id" --arg issue "$ISSUE_NODE_ID" '.data.node.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false and .content.id == $issue) | .id' <<<"$issue_json" | head -n1)"

          if [ -z "$item_id" ]; then
            echo "No active Project Item found through Issue.projectItems; adding Issue to the Project..."
            ADD_MUTATION='
            mutation($project:ID!, $issue:ID!) {
              addProjectV2ItemById(input:{projectId:$project, contentId:$issue}) {
                item { id }
              }
            }'
            item_id="$(gh api graphql -f query="$ADD_MUTATION" -F project="$project_id" -F issue="$ISSUE_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')"
            sleep 1

            # Re-discover through the same authorization-compatible Issue
            # connection instead of trusting the mutation response as proof.
            issue_json="$(gh api graphql -f query="$ISSUE_QUERY" -F issue="$ISSUE_NODE_ID")"
            sleep 1
            item_id="$(jq -r --arg project "$project_id" --arg issue "$ISSUE_NODE_ID" '.data.node.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false and .content.id == $issue) | .id' <<<"$issue_json" | head -n1)"
          else
            echo "Existing active Project Item found: $item_id"
          fi

          [ -n "$item_id" ] || { echo "Project Item creation/lookup returned no active item ID."; exit 1; }

          if [ "$ISSUE_ACTION" = "opened" ]; then
            current_urgency="$(jq -r --arg project "$project_id" --arg issue "$ISSUE_NODE_ID" '.data.node.projectItems.nodes[]? | select(.project.id == $project and .isArchived == false and .content.id == $issue) | if .urgencyValue.number == null then empty else (.urgencyValue.number|tostring) end' <<<"$issue_json" | head -n1)"
            if [ -z "$current_urgency" ]; then
              echo "Initializing Issue Project Item Urgency to 0 (unknown/not assessed)..."
              SET_URGENCY_MUTATION='mutation($project:ID!, $item:ID!, $field:ID!, $number:Float!) { updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{number:$number}}) { projectV2Item { id } } }'
              gh api graphql -f query="$SET_URGENCY_MUTATION" -F project="$project_id" -F item="$item_id" -F field="$urgency_field_id" -F number=0 >/dev/null
              sleep 1
            fi
          fi

          echo "Setting Project Item Status to $TARGET_LABEL..."
          SET_STATUS_MUTATION='
          mutation($project:ID!, $item:ID!, $field:ID!, $option:String!) {
            updateProjectV2ItemFieldValue(input:{
              projectId:$project
              itemId:$item
              fieldId:$field
              value:{singleSelectOptionId:$option}
            }) {
              projectV2Item { id }
            }
          }'
          gh api graphql \
            -f query="$SET_STATUS_MUTATION" \
            -F project="$project_id" \
            -F item="$item_id" \
            -F field="$status_field_id" \
            -F option="$target_option_id" \
            >/dev/null
          sleep 1

          echo "Independently verifying Project Item identity, archive state, Status name and option ID..."
          VERIFY_QUERY='
          query($item:ID!) {
            node(id:$item) {
              ... on ProjectV2Item {
                id
                isArchived
                project { id title number }
                content { ... on Issue { id number } }
                fieldValueByName(name:"Status") {
                  ... on ProjectV2ItemFieldSingleSelectValue {
                    name
                    optionId
                  }
                }
                urgencyValue: fieldValueByName(name:"Urgency") {
                  ... on ProjectV2ItemFieldNumberValue { number }
                }
              }
            }
          }'
          verify_json="$(gh api graphql -f query="$VERIFY_QUERY" -F item="$item_id")"
          sleep 1

          verified_item_id="$(jq -r '.data.node.id // empty' <<<"$verify_json")"
          verified_project_id="$(jq -r '.data.node.project.id // empty' <<<"$verify_json")"
          verified_project_title="$(jq -r '.data.node.project.title // empty' <<<"$verify_json")"
          verified_issue_id="$(jq -r '.data.node.content.id // empty' <<<"$verify_json")"
          verified_issue="$(jq -r '.data.node.content.number // empty' <<<"$verify_json")"
          verified_status="$(jq -r '.data.node.fieldValueByName.name // empty' <<<"$verify_json")"
          verified_option="$(jq -r '.data.node.fieldValueByName.optionId // empty' <<<"$verify_json")"
          archived="$(jq -r '.data.node.isArchived' <<<"$verify_json")"
          verified_urgency="$(jq -r 'if .data.node.urgencyValue.number == null then empty else (.data.node.urgencyValue.number|tostring) end' <<<"$verify_json")"

          [ "$verified_item_id" = "$item_id" ] || { echo "Verification failed: Project Item identity mismatch."; exit 1; }
          [ "$verified_project_id" = "$project_id" ] || { echo "Verification failed: Project identity mismatch."; exit 1; }
          [ "$verified_project_title" = "$PROJECT_TITLE" ] || { echo "Verification failed: Project title mismatch."; exit 1; }
          [ "$verified_issue_id" = "$ISSUE_NODE_ID" ] || { echo "Verification failed: Project Item does not contain the triggering Issue identity."; exit 1; }
          [ "$verified_issue" = "$ISSUE_NUMBER" ] || { echo "Verification failed: Project Item does not contain Issue #$ISSUE_NUMBER."; exit 1; }
          [ "$archived" = "false" ] || { echo "Verification failed: Project Item is archived."; exit 1; }
          [ "$verified_status" = "$TARGET_LABEL" ] || { echo "Verification failed: Project Item Status is '$verified_status', not $TARGET_LABEL."; exit 1; }
          [ "$verified_option" = "$target_option_id" ] || { echo "Verification failed: Status option ID does not match $TARGET_LABEL."; exit 1; }
          if [ "$ISSUE_ACTION" = "opened" ]; then
            [ -n "$verified_urgency" ] || { echo "Verification failed: newly opened Issue Project Item has no Urgency value."; exit 1; }
            jq -e --argjson value "$verified_urgency" '$value >= 0 and $value <= 5 and ($value|floor) == $value' >/dev/null || { echo "Verification failed: Issue Urgency '$verified_urgency' is outside integer 0..5."; exit 1; }
          fi

          echo "PASS: Issue #$ISSUE_NUMBER is verified as active Project Item $item_id in '$PROJECT_TITLE' with Project Item Status $TARGET_LABEL ($target_option_id) and Urgency $verified_urgency."
          trap - ERR
