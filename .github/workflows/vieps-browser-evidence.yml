name: VIEPS browser acceptance evidence

on:
  pull_request:
    paths:
      - ".github/workflows/vieps-browser-evidence.yml"
      - "4-Production/internet/cloudflare/workers/jagports/public/**"
      - "4-Production/internet/cloudflare/workers/jagports/styles/**"
      - "4-Production/internet/cloudflare/workers/jagports/js/**"
      - "4-Production/internet/cloudflare/workers/jagports/scripts/build-*.mjs"
      - "5-Implementation-Projects/internet/jagports/solution/vieps/i18n/**"
      - "4-Production/internet/cloudflare/workers/jagports/scripts/browser-evidence.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/vieps-browser-evidence.yml"
      - "4-Production/internet/cloudflare/workers/jagports/public/**"
      - "4-Production/internet/cloudflare/workers/jagports/styles/**"
      - "4-Production/internet/cloudflare/workers/jagports/js/**"
      - "4-Production/internet/cloudflare/workers/jagports/scripts/build-*.mjs"
      - "5-Implementation-Projects/internet/jagports/solution/vieps/i18n/**"
      - "4-Production/internet/cloudflare/workers/jagports/scripts/browser-evidence.mjs"
  workflow_dispatch:
    inputs:
      deployed_url:
        description: "Optional deployed-main VIEPS URL; checks remote TEST and real catalogue plus Admin screenshots"
        required: false
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 4-Production/internet/cloudflare/workers/jagports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 4-Production/internet/cloudflare/workers/jagports/package-lock.json
      - name: Build the UI and verify generated assets
        run: |
          npm ci
          npm run build
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise Web TEST/real modes and Stock/Fit Admin; capture screenshots
        run: node scripts/browser-evidence.mjs
        env:
          VIEPS_BROWSER_URL: ${{ inputs.deployed_url || '' }}
      - name: Preserve browser screenshots even if an assertion fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vieps-browser-evidence
          path: 4-Production/internet/cloudflare/workers/jagports/browser-evidence/
          if-no-files-found: warn
          retention-days: 14
