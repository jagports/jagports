name: P7 offline Python regression tests

on:
  push:
    branches:
      - impl/p7-model-backed-research-product
    paths:
      - '6-Development/AI/agents/jagports/jagports-lead-agent/**'
      - '.github/workflows/p7-offline-tests.yml'
  pull_request:
    paths:
      - '6-Development/AI/agents/jagports/jagports-lead-agent/**'
      - '.github/workflows/p7-offline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mocked-p7-and-legacy:
    name: Offline P7 and legacy Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 6-Development/AI/agents/jagports/jagports-lead-agent
    env:
      OPENAI_API_KEY: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install import-only Python dependencies
        run: python -m pip install 'PyGithub>=2.6,<3' 'python-dotenv>=1,<2' 'PyYAML>=6,<7'
      - name: Compile Python modules and tests
        run: python -m compileall -q agents core services tests main.py
      - name: Mocked Research Product P7 and legacy regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
