name: JEPC importer runtime tests

on:
  pull_request:
    paths:
      - '5-Implementation-Projects/software/jlr/JEPC/DataImporter/**'
      - '.github/workflows/jepc-importer-runtime.yml'
  push:
    branches: [main]
    paths:
      - '5-Implementation-Projects/software/jlr/JEPC/DataImporter/**'
      - '.github/workflows/jepc-importer-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: 5-Implementation-Projects/software/jlr/JEPC/DataImporter
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test runtime and CLI contracts without source installation
        working-directory: 5-Implementation-Projects/software/jlr/JEPC/DataImporter
        run: npm test
