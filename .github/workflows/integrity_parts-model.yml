name: VIEPS model integrity tests

on:
  pull_request:
    paths:
      - '4-Production/internet/cloudflare/workers/jagports/**'
      - '5-Implementation-Projects/internet/jagports/solution/vieps/SPEC/**'
      - '5-Implementation-Projects/internet/jagports/solution/vieps/i18n/**'
      - '6-Development/libraries/css/tailwind/**'
      - '.github/workflows/integrity_parts-model.yml'
      - '3-Deployment/internet/github/actions/tests/integrity_model_part.md'
      - '3-Deployment/internet/github/actions/tests/integrity_model_stock.md'
  push:
    branches: [main]
    paths:
      - '4-Production/internet/cloudflare/workers/jagports/**'
      - '5-Implementation-Projects/internet/jagports/solution/vieps/SPEC/**'
      - '5-Implementation-Projects/internet/jagports/solution/vieps/i18n/**'
      - '6-Development/libraries/css/tailwind/**'
      - '.github/workflows/integrity_parts-model.yml'
      - '3-Deployment/internet/github/actions/tests/integrity_model_part.md'
      - '3-Deployment/internet/github/actions/tests/integrity_model_stock.md'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            4-Production/internet/cloudflare/workers/jagports
            5-Implementation-Projects/internet/jagports/solution/vieps/SPEC
            5-Implementation-Projects/internet/jagports/solution/vieps/i18n
            6-Development/libraries/css/tailwind/4.1.13
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore locked Worker build dependencies
        working-directory: 4-Production/internet/cloudflare/workers/jagports
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify generated deploy assets
        working-directory: 4-Production/internet/cloudflare/workers/jagports
        run: npm run build
      - name: Verify clean local D1 bootstrap and live STOCK evidence with Wrangler
        working-directory: 4-Production/internet/cloudflare/workers/jagports
        run: |
          D1_STATE="$RUNNER_TEMP/vieps-d1-model-integrity"
          rm -rf "$D1_STATE"
          npx wrangler d1 migrations apply jagports --local --persist-to "$D1_STATE"
          npx wrangler d1 migrations list jagports --local --persist-to "$D1_STATE"
          npx wrangler d1 execute jagports --local --persist-to "$D1_STATE" --command "SELECT id, part_id, quantity, condition_code, available, storage_location_id, source_party_id, price, currency FROM stock_item LIMIT 0; SELECT id, name FROM stock_site LIMIT 0; SELECT id, site_id, parent_id, location_type, name FROM stock_location LIMIT 0; SELECT id, source_type, name FROM stock_source_party LIMIT 0;"
          npx wrangler d1 execute jagports --local --persist-to "$D1_STATE" --file tests/fixtures/stock_live_jagports.sql
          LIVE_STOCK="$(npx wrangler d1 execute jagports --local --persist-to "$D1_STATE" --command "SELECT part_number, quantity, condition_code, available, location, source, source_ref, price FROM stock_item WHERE part_number='HJA3403AB';")"
          printf '%s\n' "$LIVE_STOCK"
          printf '%s\n' "$LIVE_STOCK" | grep -F "HJA3403AB"
          printf '%s\n' "$LIVE_STOCK" | grep -F "R2A / B14"
          printf '%s\n' "$LIVE_STOCK" | grep -F "jagports-xlsx"
      - name: Execute model, migration and Worker tests
        working-directory: 4-Production/internet/cloudflare/workers/jagports
        run: npm test
