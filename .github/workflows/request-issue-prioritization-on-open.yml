name: Request Issue Prioritization on Open

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  request-prioritization:
    runs-on: ubuntu-latest
    steps:
      - name: Record @priorize request for opened Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          marker="<!-- jagports-auto-priorize-request -->"
          body="$(printf '%s\n@priorize %s\n\nAutomatically requested when Issue #%s opened. Execute the canonical @priorize Issue path for this Issue itself, including native Issue Priority and Project Item Rank, Urgency, Workstream and Status.' "$marker" "$ISSUE_NUMBER" "$ISSUE_NUMBER")"

          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s 'add // []')"
          existing_count="$(jq --arg marker "$marker" '[.[] | select((.body | split("\n") | index($marker)) != null)] | length' <<<"$comments")"

          if [ "$existing_count" -gt 0 ]; then
            echo "PASS: Issue #$ISSUE_NUMBER already has the automatic prioritization request."
            exit 0
          fi

          created="$(gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body")"
          created_id="$(jq -r '.id // empty' <<<"$created")"
          [ -n "$created_id" ] || { echo "Automatic Issue prioritization request comment was not created."; false; }

          verify="$(gh api "repos/$REPOSITORY/issues/comments/$created_id")"
          verify_body="$(jq -r '.body // empty' <<<"$verify")"
          grep -Fxq "$marker" <<<"$verify_body" || { echo "Marker verification failed."; false; }
          grep -Fxq "@priorize $ISSUE_NUMBER" <<<"$verify_body" || { echo "@priorize request verification failed."; false; }

          echo "PASS: Issue #$ISSUE_NUMBER received the @priorize request on open."
