name: Audit Pull Request Project Lifecycle

on:
  workflow_dispatch:
    inputs:
      fail_on_drift:
        description: Fail the run when definite lifecycle drift is found
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/scripts/audit-pr-project-lifecycle.sh
      - .github/workflows/audit-pr-project-lifecycle.yml

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  PROJECT_ORG: jagports
  PROJECT_NUMBER: "9"
  PROJECT_TITLE: Jagports AI OS

jobs:
  audit-pr-project-lifecycle:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit Pull Request Project Items
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          FAIL_ON_DRIFT: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_drift && 'true' || 'false' }}
        run: bash .github/scripts/audit-pr-project-lifecycle.sh

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-project-lifecycle-audit-${{ github.run_id }}
          path: pr-project-lifecycle-audit.tsv
          if-no-files-found: warn
