<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jagports MVP</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:1rem;line-height:1.4}
    nav{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}button,input,select,textarea{font:inherit;padding:.5rem}button{cursor:pointer}
    section{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}
    table{width:100%;border-collapse:collapse;margin-top:1rem}th,td{border-bottom:1px solid #ddd;text-align:left;padding:.45rem;vertical-align:top}
    .muted{color:#666}.status{padding:.4rem;border-radius:4px;background:#eee}.danger{color:#900}
  </style>
</head>
<body>
  <header><h1>Jagports MVP</h1><p class="muted">Vehicle context · Parts · Stock inventory</p></header>
  <section><h2>Admin access</h2><input id="token" type="password" placeholder="MVP admin token" autocomplete="off"><button id="saveToken">Use token</button><span id="authStatus" class="status">Not authenticated</span></section>
  <nav><button data-section="vehicle">Vehicle</button><button data-section="parts">Parts</button><button data-section="stock">Stock</button><button data-section="status">Status</button></nav>
  <main>
    <section id="vehicle"><h2>Vehicle</h2><div class="grid"><input id="vehicleVin" placeholder="VIN / identifier"><input id="vehicleSerial" placeholder="Serial"><input id="vehicleModel" placeholder="Model range"><input id="vehicleMarket" placeholder="Market"></div><button id="saveVehicle">Save vehicle context</button><button id="findVehicles">Find vehicles</button><div id="vehicleResults"></div></section>
    <section id="parts" hidden><h2>Parts</h2><input id="partQuery" placeholder="Part number or description"><button id="findParts">Search</button><div id="partResults"></div></section>
    <section id="stock" hidden><h2>Stock inventory</h2><div class="grid"><input id="stockPart" placeholder="Part number"><input id="stockQty" type="number" min="0" value="1" placeholder="Quantity"><input id="stockCondition" placeholder="Condition"><input id="stockStatus" value="available" placeholder="Status"><input id="stockLocation" placeholder="Location"><input id="stockDonor" placeholder="Donor vehicle"><input id="stockSource" placeholder="Source reference"><textarea id="stockNotes" placeholder="Notes"></textarea></div><button id="addStock">Add stock item</button><input id="stockQuery" placeholder="Search stock"><button id="findStock">Search stock</button><div id="stockResults"></div></section>
    <section id="status" hidden><h2>Status</h2><button id="health">Check API / database</button><pre id="healthResult"></pre></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
