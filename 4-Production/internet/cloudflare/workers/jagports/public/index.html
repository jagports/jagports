<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VIEPS</title>
  <link rel="stylesheet" href="vieps-tailwind.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="locale-control" role="group" data-i18n-aria-label="locale.label">
        <button type="button" class="locale-button" data-language="fi" aria-label="fi-FI" title="fi-FI">🇫🇮 <span>[fi-FI]</span></button>
        <button type="button" class="locale-button" data-language="en" aria-label="en-GB" title="en-GB">🇬🇧 <span>[en-GB]</span></button>
      </div>
      <div><p class="eyebrow" data-i18n="header.product_name"></p><h1>VIEPS</h1></div>
    </header>
    <div id="result" class="concept-grid">
      <section class="panel search-panel" aria-labelledby="search-heading">
        <div class="search-availability-strip">
          <div class="search-block">
            <h2 id="search-heading" data-i18n="common.search"></h2>
            <form id="partSearch" class="search-form">
              <label for="partNumber" class="visually-hidden" data-i18n="search.input_aria"></label>
              <input id="partNumber" name="partNumber" autocomplete="off" data-i18n-placeholder="search.input_placeholder" data-i18n-aria-label="search.input_aria">
              <button type="submit" data-i18n="common.search"></button>
            </form>
          </div>
          <div class="availability-block">
            <span data-i18n="common.availability"></span>
            <label for="availabilitySelect">
              <input id="availabilitySelect" type="checkbox" aria-describedby="availabilityStatus">
              <span data-i18n="stock.filter_on_stock"></span>
            </label>
            <p id="availabilityStatus" class="muted compact-note" data-i18n="stock.filter_on_stock_note"></p>
          </div>
        </div>
        <p id="searchStatus" class="muted status-line" role="status"></p>
      </section>
      <section class="panel tree-panel" aria-labelledby="tree-heading">
        <div class="section-heading"><p class="eyebrow" data-i18n="tree.catalogue_context"></p><h2 id="tree-heading" data-i18n="tree.heading"></h2></div>
        <aside class="fixture-guide" data-i18n-aria-label="fixture.test_guidance_aria">
          <p class="eyebrow" data-i18n="fixture.tester_data"></p>
          <h3 data-i18n="fixture.heading"></h3>
          <p class="muted compact-note" data-i18n="fixture.randomized_note"></p>
          <ul>
            <li><code>MJB7703AA</code> — <span data-i18n="fixture.mjb7703aa_description"></span></li>
            <li><code>MNA7691AA</code> — <span data-i18n="fixture.mna7691aa_description"></span></li>
            <li><code>XR847031</code> — <span data-i18n="fixture.xr847031_description"></span></li>
            <li><code>FIX538C</code> — <span data-i18n="fixture.fix538c_description"></span></li>
          </ul>
          <h3 data-i18n="fixture.descriptive_heading"></h3>
          <p class="muted compact-note" data-i18n="fixture.descriptive_note"></p>
          <ul>
            <li><code>firtree1</code> — <span data-i18n="fixture.firtree1_description"></span></li>
            <li><code>firtree2</code> — <span data-i18n="fixture.firtree2_description"></span></li>
          </ul>
        </aside>
        <div id="tree"></div>
      </section>
      <section class="panel ranges-panel" aria-labelledby="ranges-heading">
        <div class="section-heading"><p class="eyebrow" data-i18n="fitment.applicability"></p><h2 id="ranges-heading" data-i18n="ranges.heading"></h2></div>
        <label for="rangeSelect" data-i18n="ranges.label"></label>
        <select id="rangeSelect" disabled></select>
        <div id="ranges"></div>
      </section>
      <section class="panel location-panel" aria-labelledby="location-heading">
        <div class="section-heading"><p class="eyebrow" data-i18n="location.main_view"></p><h2 id="location-heading" data-i18n="location.heading"></h2></div>
        <div id="vehicleLocation" class="vehicle-location-canvas"></div>
        <p id="locationStatus" class="muted compact-note"></p>
      </section>
      <section class="panel fitment-panel" aria-labelledby="fitment-heading">
        <div class="section-heading"><p class="eyebrow" data-i18n="fitment.applicability"></p><h2 id="fitment-heading" data-i18n="fitment.heading"></h2></div>
        <p id="selectedRange" class="muted"></p>
        <div id="fitment"></div>
      </section>
      <section class="panel visual-panel" aria-labelledby="visual-heading">
        <div class="section-heading"><p class="eyebrow" data-i18n="visual.main_view"></p><h2 id="visual-heading" data-i18n="visual.heading"></h2></div>
        <div id="partCard" class="card"></div>
        <div id="visualChooser" hidden><label for="visualSelect" data-i18n="visual.chooser_label"></label><select id="visualSelect"></select></div>
        <div id="visuals"></div>
      </section>
    </div>
  </main>
  <script src="i18n-resources.js"></script>
  <script src="i18n-runtime.js"></script>
  <script src="app.js"></script>
</body>
</html>
