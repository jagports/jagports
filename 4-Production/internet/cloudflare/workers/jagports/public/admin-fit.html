<!doctype html>
<html lang="en" class="stock-admin-document" data-admin-page="fit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VIEPS Fit Admin</title>
  <link rel="stylesheet" href="vieps-tailwind.css">
</head>
<body class="stock-admin-page">
  <main class="app-shell stock-admin-shell">
    <header class="app-header">
      <div class="locale-control" role="group" data-i18n-aria-label="locale.label">
        <button type="button" class="locale-button" data-language="fi" aria-label="fi-FI">🇫🇮 <span>[fi-FI]</span></button>
        <button type="button" class="locale-button" data-language="en" aria-label="en-GB">🇬🇧 <span>[en-GB]</span></button>
      </div>
      <div><p class="eyebrow" data-i18n="header.product_name"></p><h1 data-i18n="stock_admin.heading"></h1></div>
    </header>
    <section class="panel">
      <h2 data-i18n="stock_admin.access_heading"></h2>
      <form id="accessForm" class="admin-access-form">
        <div class="admin-field admin-field-grow">
          <label for="adminToken" data-i18n="stock_admin.token_label"></label>
          <input id="adminToken" type="password" autocomplete="current-password" required>
        </div>
        <button class="admin-button" type="submit" data-i18n="stock_admin.connect"></button>
      </form>
      <p id="status" class="muted status-line" role="status"></p>
    </section>
    <section class="fit-admin-grid" id="fitAdminPanel" aria-labelledby="fitAdminHeading">
      <h2 id="fitAdminHeading" data-i18n="fit_admin.heading"></h2>
      <p class="muted compact-note" data-i18n="fit_admin.note"></p>
      <p id="fitAdminStatus" class="muted status-line" role="status" aria-live="polite"></p>
      <form id="fitCategoryForm" class="fit-admin-column">
        <h3 data-i18n="fit_admin.category_heading"></h3>
        <div class="admin-form-grid">
          <div class="admin-field admin-field-wide"><label for="fitCategorySelect" data-i18n="fit_admin.category_select"></label><select id="fitCategorySelect"><option value=""></option></select></div>
          <div class="admin-field"><label for="fitCategoryCode" data-i18n="fit_admin.category_code"></label><input id="fitCategoryCode" maxlength="64" pattern="[a-z][a-z0-9_]*" required></div>
          <div class="admin-field"><label for="fitCategoryNameEn" data-i18n="fit_admin.name_en"></label><input id="fitCategoryNameEn" maxlength="120" required></div>
          <div class="admin-field"><label for="fitCategoryNameFi" data-i18n="fit_admin.name_fi"></label><input id="fitCategoryNameFi" maxlength="120" required></div>
          <div class="admin-field"><label for="fitCategoryDescriptionEn" data-i18n="fit_admin.description_en"></label><input id="fitCategoryDescriptionEn" maxlength="1000" required></div>
          <div class="admin-field"><label for="fitCategoryDescriptionFi" data-i18n="fit_admin.description_fi"></label><input id="fitCategoryDescriptionFi" maxlength="1000" required></div>
        </div>
        <div class="admin-actions">
          <button class="admin-button" type="submit" data-i18n="fit_admin.save_category"></button>
          <button class="admin-button admin-button-secondary" id="fitNewCategory" type="button" data-i18n="fit_admin.new_category"></button>
          <button class="admin-button admin-button-danger" id="fitRetireCategory" type="button" data-i18n="fit_admin.retire_category" disabled></button>
        </div>
      </form>
      <form id="fitValueForm" class="fit-admin-column">
        <h3 data-i18n="fit_admin.value_heading"></h3>
        <div class="admin-form-grid">
          <div class="admin-field"><label for="fitValueCategory" data-i18n="fit_admin.value_category"></label><select id="fitValueCategory" required></select></div>
          <div class="admin-field"><label for="fitValueSelect" data-i18n="fit_admin.value_select"></label><select id="fitValueSelect"><option value=""></option></select></div>
          <div class="admin-field"><label for="fitValueCode" data-i18n="fit_admin.value_code"></label><input id="fitValueCode" maxlength="64" pattern="[A-Za-z][A-Za-z0-9_]*" required></div>
          <div class="admin-field"><label for="fitValueNameEn" data-i18n="fit_admin.name_en"></label><input id="fitValueNameEn" maxlength="120" required></div>
          <div class="admin-field"><label for="fitValueNameFi" data-i18n="fit_admin.name_fi"></label><input id="fitValueNameFi" maxlength="120" required></div>
          <div class="admin-field"><label for="fitValueDescriptionEn" data-i18n="fit_admin.description_en"></label><input id="fitValueDescriptionEn" maxlength="1000" required></div>
          <div class="admin-field"><label for="fitValueDescriptionFi" data-i18n="fit_admin.description_fi"></label><input id="fitValueDescriptionFi" maxlength="1000" required></div>
        </div>
        <div class="admin-actions">
          <button class="admin-button" type="submit" data-i18n="fit_admin.save_value"></button>
          <button class="admin-button admin-button-secondary" id="fitNewValue" type="button" data-i18n="fit_admin.new_value"></button>
          <button class="admin-button admin-button-danger" id="fitRetireValue" type="button" data-i18n="fit_admin.retire_value" disabled></button>
        </div>
      </form>
      <div class="fit-admin-column"><form id="fitSourceSearch">
        <h3 data-i18n="fit_admin.source_heading"></h3>
        <div class="admin-search-row">
          <label for="fitSourceQuery" class="visually-hidden" data-i18n="fit_admin.source_query"></label>
          <input id="fitSourceQuery" data-i18n-placeholder="fit_admin.source_query">
          <button class="admin-button" type="submit" data-i18n="common.search"></button>
        </div>
        <div class="admin-field">
          <label for="fitSourceSelect" data-i18n="fit_admin.source_select"></label>
          <select id="fitSourceSelect" size="5" aria-describedby="fitSourceDetails"></select>
        </div>
        <p id="fitSourceDetails" class="muted compact-note" aria-live="polite"></p>
        <button id="fitMoreSources" class="admin-button admin-button-secondary" type="button" data-i18n="fit_admin.more_sources" hidden></button>
      </form>
      <form id="fitMappingForm">
        <h3 data-i18n="fit_admin.mapping_heading"></h3>
        <div class="admin-form-grid">
          <div class="admin-field"><label for="fitMappingCategory" data-i18n="fit_admin.mapping_category"></label><select id="fitMappingCategory" required></select></div>
          <div class="admin-field"><label for="fitMappingValue" data-i18n="fit_admin.mapping_value"></label><select id="fitMappingValue" required></select></div>
          <div class="admin-field"><label for="fitMappingStatus" data-i18n="fit_admin.mapping_status"></label><select id="fitMappingStatus">
            <option value="proposed" data-i18n="fit_admin.proposed"></option>
            <option value="verified" data-i18n="fit_admin.verified"></option>
            <option value="conflict" data-i18n="fit_admin.conflict"></option>
            <option value="retired" data-i18n="fit_admin.retired"></option>
            <option value="fixture" data-i18n="fit_admin.fixture"></option>
          </select></div>
          <div class="admin-field"><label for="fitMappingVersion" data-i18n="fit_admin.mapping_version"></label><input id="fitMappingVersion" maxlength="120" required></div>
          <div class="admin-field"><label for="fitReviewerRef" data-i18n="fit_admin.reviewer_ref"></label><input id="fitReviewerRef" maxlength="200"></div>
          <div class="admin-field admin-field-wide"><label for="fitEvidenceNote" data-i18n="fit_admin.evidence_note"></label><textarea id="fitEvidenceNote" maxlength="2000" required></textarea></div>
        </div>
        <div class="admin-actions">
          <button class="admin-button" type="submit" data-i18n="fit_admin.save_mapping"></button>
          <button class="admin-button admin-button-secondary" id="fitShowHistory" type="button" data-i18n="fit_admin.history"></button>
        </div>
        <ol id="fitHistory" aria-live="polite"></ol>
      </form>
    </div>
    </section>
  </main>
  <script src="i18n-resources.js"></script>
  <script src="i18n-runtime.js"></script>
  <script src="stock-admin.js"></script>
</body>
</html>
