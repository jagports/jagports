agent:
  name: Jagports Lead

github:
  repository: jagports/jagports
  max_requests_per_run: 12  # verified low-level GET attempts incl. pagination

polling:
  interval_minutes: 585

openai:
  enabled: false

# The paid two-role pilot stays disabled until exact Issue/source settings are configured.
# Product Owner has authorized reasonable capped tests within a total $5 API pool;
# this does not authorize uncontrolled recurring spending.
# Leave the allowlist and source approval empty on all installations by default.
p7:
  enabled: false
  allowed_issue_numbers: []
  approved_source_revision: ""
  read_only_credential_confirmed: false
  pending_event_file: ""
  approved_research_paths: []
  approved_domain_paths: []
  reasoning:
    enabled: false
    # Local ledger's cumulative cap; leave headroom in the $5 project pool.
    # This does not include other clients or pre-existing API charges.
    max_total_cost_usd: 4.0
