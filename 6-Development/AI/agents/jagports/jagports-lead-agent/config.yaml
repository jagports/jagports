agent:
  name: Jagports Lead

github:
  repository: jagports/jagports
  max_requests_per_run: 12  # verified low-level GET attempts incl. pagination

polling:
  interval_minutes: 585

openai:
  enabled: false

reasoning:
  enabled: false
  allowed_issue_numbers: []
  approved_source_revision: ""
  ask_enabled: false

telegram:
  enabled: false

# Existing state/model_usage.json is retained across upgrades. Any future
# model-backed original specialist must reconcile prior charged or uncertain
# attempts before enabling calls; removing old configuration does not reset spend.
