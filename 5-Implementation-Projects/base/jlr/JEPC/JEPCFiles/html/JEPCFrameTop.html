<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<title>JEPC - Frame Top</title>
		<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
		<meta http-equiv="cache-control" content="no-cache" />
		<link type="text/css" href="../styles/style.css" rel="stylesheet" media="screen" />
		<script type="text/javascript" language="javascript" src="../js/Constants.js"></script>
		<script type="text/javascript" language="javascript" src="../js/JEPC.js"></script>
		<script type="text/javascript" language="javascript" src="../js/I18nLabels.js"></script>
		<script type="text/javascript" language="javascript" src="../js/menuG5FX.js"></script>
		<script type="text/javascript" language="javascript" src="../js/I18nMessages.js"></script>
		<script type="text/javascript" language="javascript" src="../js/JSSerializer.js"></script>
		<script type="text/javascript" language="javascript" src="../js/AJAX_Util.js"></script>
		<script type="text/javascript" language="javascript" src="../js/FrameTop.js"></script>
		<script type="text/javascript" language="javascript" src="../js/CartFiles.js"></script>
		<script type="text/javascript" language="javascript" src="../js/ShoppingCart.js"></script>
   		<script type="text/javascript" language="javascript" src="../js/JEPCNavigation.js"></script>
	</head>
	<body bgcolor="#000000" onload="setLanguage();initMenu('Demo','JEPCFrameTop');listCartNames();">
		<form name="frameTop" method="post" action="" onsubmit="javascript:prepareGo('GO');return false;">
			<table width="101%" cellpadding="0" cellspacing="0" border="0" summary="Logo and Heading Table">
				<tr>
					<td width="10%" class="storeName">
						<img src="../images/pixt.gif" alt="pixt" title="pixt" width="20" height="1" />
						<label class="newJaguarNav" id="New_Jaguar_EPC">The New Jaguar EPC</label>
					</td>
					<td colspan="2" width="10%" class="storeName">
						<img src="../images/Jaglogo.jpg" align="right" alt="Jaguar Logo" />
					</td>
				</tr>
			</table>
			<table cellpadding="4" cellspacing="0" border="0" width="101%" summary="Main Navigation Table">
				<tbody>
					<tr>
                        <td class="mainNavigation" align="left">
                           <a href="javascript:historyBack()"><img border="0" id="histBckBtn" src="../images/navback.gif"></img></a>&nbsp;
                           <a href="javascript:historyForward()"><img border="0" id="histFwdBtn" src="../images/navforward.gif"></img></a>&nbsp;
                           <a href="javascript:displayHistoryList()"><img border="0" id="histDspBtn" src="../images/downArrow.gif"></img></a>&nbsp;
                           <a href="javascript:refreshPage()"><img border="0" src="../images/navreload.gif"></img></a>&nbsp;
                           <a href="javascript:printPage()"><img border="0" src="../images/navprint.gif"></img></a>
                        </td>
						<td class="mainNavigation">
							<span id="adminSlot"></span>
							<a href="JEPCAdvancedSearch.html" target="mainFrame" id="Adv_Search_ID" class="mainNavLinks" onclick="resetVinDecode();">Advanced Search</a>&nbsp;&nbsp;&nbsp;
							<a href="javascript:resetVinDecode();checkInternet('JEPCDealerNoteView.html');" id="Dealer_Notes_ID" class="mainNavLinks">Dealer Notes View</a>&nbsp;&nbsp;&nbsp;
							<a href="javascript:resetVinDecode(); checkInternet('JEPCPibView.html');" id="Pib_View_ID" class="mainNavLinks">PIB View</a>&nbsp;&nbsp;&nbsp;
							<a href="javascript:resetVinDecode(); checkInternet('JEPCMyCustomer.html');" id="My_Customers_ID" class="mainNavLinks">My Customers</a>&nbsp;&nbsp;&nbsp;
							<a href="JEPCContact.html?flag=2" target="mainFrame" id="Contact_Us_ID" class="mainNavLinks" onclick="resetVinDecode();">Contact Us</a>&nbsp;&nbsp;&nbsp;
							<a href="javascript:resetVinDecode();openHelp();" id="Help_ID" class="mainNavLinks">Help</a>&nbsp;&nbsp;&nbsp;
							<a href="JEPCThesaurus.html" target="mainFrame" id="Thesaurus_ID" class="mainNavLinks" onclick="resetVinDecode();">Thesaurus</a>&nbsp;&nbsp;&nbsp;
							<span id="changePasswordSlot"></span>
							<span id="changeEdixDetailsSlot"></span>
							<a href="JEPCSystemHelp.html" target="mainFrame" id="System_Help_ID" class="mainNavLinks" onclick="resetVinDecode();">System Help</a>&nbsp;&nbsp;&nbsp;
							<a href="javascript:checkSurvey();" target="_self" id="Log_Out_ID" class="mainNavLinks">Log Out</a>&nbsp;&nbsp;&nbsp;
						</td>
					</tr>
				</tbody>
			</table>
			<table width="101%" id="cartTable" class="cartTableStyle" summary="Shopping Cart Table">
				<tr>
					<td width="1">
						<div id="shoppingCartAjax">
							<table cellpadding="1" cellspacing="1" border="0" style="margin-left: 10px" summary="Contains Basket Details">
								<tr>
									<td rowspan="2" id="cartBasketCell">
										<select class="transparentBackground" name="minicartName" onchange="displayCartDetails();">
										</select>
									</td>
									<td rowspan="2" class="transparentBackground">
										<a href="javascript:displayCartScreen();" class="mainHeading"> <img src="../images/minicart.gif" border="0" alt="Shopping Cart" /></a>
									</td>
									<td nowrap="nowrap" class="miniText" ><label id="TotalItems">0</label><label>&nbsp; </label><label class="price" id="Items_In_Cart_ID">Item(s) in Cart</label></td>
								</tr>
								<tr>
									<td nowrap="nowrap" class="miniText"><label id="Subtotal_ID">Subtotal </label><label class="price" id="currency_ID">&nbsp; : &pound;</label><label class="price" id="SubTotalValue">0</label>&nbsp;</td>
								</tr>
							</table>
						</div>
					</td>
					<td>
						<table summary="Contains Link for Search" border="0" style="margin-left: 15px">
							<tr>
								<td class="transparentBackground"><label id="SearchLabel_ID">Search</label></td>
								<td class="transparentBackground" valign="middle">
									<input size="20" maxlength="50" type="text" id="Search_Field_ID" name="searchTerm" class="toUpperCase" />&nbsp;
								</td>
								<td valign="top" class="buttoncell">
									<input class="button" name="Go_ID" type="button" value="Go" id="Go_ID" onclick="javascript:prepareGo('GO');" />
								</td>
								<td class="vinSearch" nowrap="nowrap"></td>
								<td class="transparentBackground" nowrap="nowrap"><label id="Or_ID">or</label></td>
								<td class="vinSearch" nowrap="nowrap"></td>
								<td valign="middle" nowrap="nowrap" class="buttoncell" id="VIN_Search_ID">
									<input class="button" name="btnSearch" type="button" value="VIN Search" disabled="disabled" onclick="prepareGo('VIN');" id="VIN_SearchID"/>
								</td>
							</tr>
						</table>
					</td>
					<td>
						<table class="innerCartDisplay" border="0" width="100%" summary="Contains Link for Model Range and Vehicle Id">
							<tr>
								<td class="buttoncell" align="right" width="30%">
									<input class="button" name="Model_Range_ID" type="button"  value="Model Range" id="Model_Range_ID" onclick="javascript:redirectToURL('JEPCModelMenu.html');" />
								</td>
								<td id="modelDropdown_id" name="modelDropdown_id" align="left" width="2%">&nbsp;

								</td>
								<td class="buttoncell" align="right" width="40%">
									<input class="button" name="Vehicle_ID_id" type="button"  value="Vehicle ID" id="Vehicle_ID_id" onclick="javascript:redirectToURL('JEPCVinDecode.html');" />
								</td>
								<td id="imageHolder" align="left" width="28%" valign="center" class="hiddenVisibility">
									<a href="javascript:showVinDropdown();"><img name = "dropdown" id="vinArrow" alt="VIN Summary" src = "../images/downArrow.gif" border="0" /></a>
								</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</form>
	</body>
</html>
